# Evaluation configuration for baseline models (no fine-tuning)

# Base models to evaluate (HuggingFace Hub model names)
models:
  - Qwen/Qwen2.5-1.5B
  - deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B

# Model-specific max lengths (will be auto-selected based on model name)
# These are defaults; script will override based on model type
max_model_length: 32768
max_new_tokens: 32768

# Evaluation dataset configuration
eval_dataset_name: beamrl_eval  # Uses RL_POST_TRAIN_CONFIG_MAP
eval_dataset_config: null  # Optional dataset configuration name
eval_split: train  # Dataset split to evaluate on

# Generation parameters
max_prompt_length: 512
max_generation_length: 4096
batch_size: 8
num_generations: 5
temperature: 0.6

# vLLM parameters
max_model_len: 32768  # Maximum model length for vLLM (should match max_model_length)
gpu_memory_utilization: 0.7
dtype: bfloat16

# Output configuration
log_wandb: true
wandb_project: beamrl-eval-baselines
# wandb_run_name will be auto-generated as: {model_name_sanitized}_baseline_beamrl_eval

# Optional: limit number of evaluation samples (null = all)
max_eval_samples: 8  # null

